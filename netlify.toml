# Netlify configuration for a Next.js (App Router) app.
# The @netlify/plugin-nextjs plugin (declared below) is auto-installed by
# Netlify at build time — it does NOT need to be in package.json.

[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- Deploy contexts (optional) ---------------------------------------------
# Uncomment and set your real URLs once the site exists on Netlify. Prefer
# setting secrets (Supabase keys, etc.) in the Netlify UI, not here.
#
# [context.production.environment]
#   NEXT_PUBLIC_APP_URL = "https://your-site.netlify.app"
#
# [context.staging.environment]
#   NEXT_PUBLIC_IS_STAGING = "true"
#   NEXT_PUBLIC_APP_URL = "https://staging--your-site.netlify.app"

# --- Security headers --------------------------------------------------------
# connect-src / img-src allow Supabase (REST, Realtime over wss, Storage).
# Tighten *.supabase.co to your exact project ref if you prefer.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
